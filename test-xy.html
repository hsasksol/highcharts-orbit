<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>xy filter test</title></head>
<body>
<div id="c1" style="height:300px"></div>
<div id="c2" style="height:300px"></div>
<script src="https://code.highcharts.com/highcharts.js"></script>
<script src="https://code.highcharts.com/modules/exporting.js"></script>
<script src="https://code.highcharts.com/modules/annotations.js"></script>
<script src="https://orbit.highsoftlabs.com/module/5150599f-09f3-4b54-a398-e60cb01da393/orbit.js"></script>
<script>
'use strict';
var DAY = 86400000;
var now = new Date();
var END = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
var vals = [];
for (var i = 0; i < 30; i++) { vals.push(100 + i); }
Highcharts.chart('c1', {
  orbit: { id: 't-implicit' },
  title: { text: 'implicit pointStart' },
  xAxis: { type: 'datetime' },
  series: [{ name: 'a', data: vals.slice(), pointStart: END - 29 * DAY, pointInterval: DAY }]
});
Highcharts.chart('c2', {
  orbit: { id: 't-explicit' },
  title: { text: 'explicit xy' },
  xAxis: { type: 'datetime' },
  series: [{ name: 'b', data: vals.map(function (v, i) { return [END - (29 - i) * DAY, v]; }) }]
});
Highcharts.orbitPage({ mode: 'augment', relationships: { enabled: true } });
</script>
</body>
</html>
